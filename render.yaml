services:
  - type: web
    name: kisansetu
    runtime: node
    plan: free
    region: singapore
    buildCommand: >
      cd client && npm install && npm run build &&
      cd ../server && npm install
    startCommand: cd server && npm run seed:if-empty && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: SESSION_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: ALLOW_OFFLINE_DEV
        value: "false"
